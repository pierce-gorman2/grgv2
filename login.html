<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — God Revealing God</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-wrap">
    <h1>God Revealing God</h1>
    <p>Admin access</p>

    <form id="login-form">
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" autofocus>
      </div>
      <p id="login-error" style="color:#c0392b;font-family:var(--sans);font-size:.85rem;margin-bottom:.75rem;min-height:1.2em;"></p>
      <button type="submit" class="btn" style="width:100%;">Sign In</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
