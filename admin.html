<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — God Revealing God</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="admin-wrap" id="admin-wrap">

    <div class="admin-header">
      <h1>New Writing</h1>
      <p>Paste your text below and publish.</p>
    </div>

    <div id="flash" class="flash"></div>

    <form id="post-form">

      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="The title of your writing" autocomplete="off">
      </div>

      <div class="form-group">
        <label for="date">Date</label>
        <input type="date" id="date">
      </div>

      <div class="form-group">
        <label for="cover-input">Cover Photo <span style="font-size:.7rem;font-weight:400;">(optional)</span></label>
        <input type="file" id="cover-input" accept="image/*"
               style="font-family:var(--sans);font-size:.85rem;color:var(--muted);">
        <img id="cover-preview" class="cover-preview" alt="Cover preview">
      </div>

      <div class="form-group">
        <label for="body">Writing</label>
        <textarea id="body" placeholder="Paste or type your writing here…&#10;&#10;Supports basic formatting:&#10;**bold**  *italic*  ## Heading  > Block quote"></textarea>
      </div>

      <div class="btn-row">
        <button type="submit" class="btn">Publish</button>
        <a href="index.html" class="btn btn-outline">View Site</a>
        <button type="button" class="btn btn-outline" id="logout-btn" style="margin-left:auto;">Sign Out</button>
      </div>

    </form>

    <div class="admin-posts">
      <h2>Published Writings</h2>
      <div id="admin-post-list"></div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
