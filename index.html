<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>God Revealing God</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #f2f0ed;
      --paper: #e9e6e1;
      --ink:   #28231e;
      --muted: #918c85;
      --gold:  #9e7f4a;
      --rule:  #dcd8d2;
      --serif: 'EB Garamond', Georgia, serif;
      --sans:  'Inter', system-ui, sans-serif;
    }

    body {
      background: var(--cream);
      color: var(--ink);
      font-family: var(--serif);
      min-height: 100vh;
    }

    /* ── Hero ── */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10rem 2rem 9rem;
      background: #e9e6e1;
      position: relative;
      border-bottom: 1px solid #d5dce8;
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 50%;
      transform: translateX(-50%);
      width: 60px; height: 2px;
      background: var(--gold);
    }

    .hero-title {
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      font-weight: 400;
      letter-spacing: .04em;
      color: #1a2033;
      line-height: 1.08;
    }

    .hero-tagline {
      font-family: var(--sans);
      font-size: .72rem;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: #8a7a5a;
      margin-top: 1.75rem;
    }

    /* ── Section ── */
    .section { max-width: 960px; margin: 0 auto; padding: 5rem 1.5rem; }

    .section-label {
      font-family: var(--sans);
      font-size: .7rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2.5rem;
      display: flex;
      align-items: center;
      gap: .9rem;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--rule);
    }

    /* ── Podcast header card ── */
    .podcast-header {
      display: flex;
      align-items: center;
      gap: 1.75rem;
      margin-bottom: 2.75rem;
      padding-bottom: 2.75rem;
      border-bottom: 1px solid var(--rule);
    }

    .podcast-art {
      width: 110px;
      height: 110px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 4px 18px rgba(0,0,0,.1);
    }

    .podcast-info h2 {
      font-size: 1.6rem;
      font-weight: 400;
      margin-bottom: .4rem;
    }

    .podcast-desc {
      font-family: var(--sans);
      font-size: .85rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: .9rem;
    }

    .podcast-links { display: flex; gap: .75rem; flex-wrap: wrap; }

    .podcast-link {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      padding: .45rem 1rem;
      border-radius: 50px;
      font-family: var(--sans);
      font-size: .75rem;
      font-weight: 500;
      letter-spacing: .04em;
      text-decoration: none;
      transition: opacity .18s;
    }

    .podcast-link:hover { opacity: .8; }

    .podcast-link.apple {
      background: #000;
      color: #fff;
    }

    .podcast-link.spotify {
      background: #1DB954;
      color: #fff;
    }

    .podcast-link svg { width: 15px; height: 15px; fill: currentColor; }

    /* ── Episodes ── */
    .episodes { display: flex; flex-direction: column; gap: 0; }

    .episode {
      display: flex;
      align-items: baseline;
      gap: 1.25rem;
      padding: 1.2rem 0;
      border-bottom: 1px solid var(--rule);
      text-decoration: none;
      color: var(--ink);
      transition: opacity .18s;
    }

    .episode:last-child { border-bottom: none; }
    .episode:hover { opacity: .65; }

    .episode-num {
      font-family: var(--sans);
      font-size: .72rem;
      color: var(--muted);
      min-width: 1.6rem;
      text-align: right;
      flex-shrink: 0;
    }

    .episode-body { flex: 1; }

    .episode-title {
      font-size: 1.1rem;
      line-height: 1.3;
      margin-bottom: .25rem;
    }

    .episode-meta {
      font-family: var(--sans);
      font-size: .72rem;
      color: var(--muted);
    }

    .episode-arrow {
      font-family: var(--sans);
      font-size: .8rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    .episodes-loading {
      font-family: var(--sans);
      font-size: .9rem;
      color: var(--muted);
      padding: 2rem 0;
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--rule);
      padding: 2rem 1.5rem;
      text-align: center;
      font-family: var(--sans);
      font-size: .68rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    @media (max-width: 540px) {
      .podcast-header { flex-direction: column; align-items: flex-start; gap: 1.25rem; }
      .podcast-art { width: 90px; height: 90px; }
    }
  </style>
</head>
<body>

  <!-- Hero -->
  <section class="hero">
    <h1 class="hero-title">God Revealing God</h1>
    <p class="hero-tagline">through His Word, by His Spirit, for His glory</p>
  </section>

  <!-- Podcasts -->
  <div class="section">
    <div class="section-label">GRG Podcasts</div>

    <div class="podcast-header">
      <img class="podcast-art"
           src="https://hosting-media.riverside.com/media/podcasts/87ed1cb3-e6d3-4987-889e-8df98a594110/logos/90d9d428-9001-4b2c-bf42-3b40fa7dd4cc.png"
           alt="Die Well">
      <div class="podcast-info">
        <h2>Die Well</h2>
        <p class="podcast-desc">The Christian life should be one that is focused on eternity. We get one life, we need to ensure we go all-in on eternity and die well.</p>
        <div class="podcast-links">
          <a class="podcast-link apple" href="https://podcasts.apple.com/us/podcast/die-well/id1871918633" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
            Apple Podcasts
          </a>
          <a class="podcast-link spotify" href="https://open.spotify.com/show/7qssKFeBSQ1iOcMrG3cqoP?si=e9df8c7dc8df4661" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
            Spotify
          </a>
        </div>
      </div>
    </div>

    <div class="episodes" id="episodes">
      <p class="episodes-loading">Loading episodes…</p>
    </div>
  </div>

  <footer>God Revealing God</footer>

  <script>
    const RSS = 'https://api.riverside.com/hosting/b6ihANCc.rss';
    const API = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(RSS) + '&count=20';

    function fmtDate(str) {
      return new Date(str).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    }

    function fmtDuration(secs) {
      if (!secs) return '';
      const m = Math.floor(secs / 60), s = secs % 60;
      return m + ':' + String(s).padStart(2, '0');
    }

    fetch(API)
      .then(r => r.json())
      .then(data => {
        const el = document.getElementById('episodes');
        if (!data.items || !data.items.length) {
          el.innerHTML = '<p style="color:var(--muted);font-family:var(--sans);font-size:.9rem;">No episodes found.</p>';
          return;
        }
        el.innerHTML = data.items.map((ep, i) => `
          <a class="episode" href="${ep.link || ep.enclosure?.link || '#'}" target="_blank" rel="noopener">
            <span class="episode-num">${String(data.items.length - i).padStart(2, '0')}</span>
            <div class="episode-body">
              <div class="episode-title">${ep.title}</div>
              <div class="episode-meta">${fmtDate(ep.pubDate)}${ep.enclosure?.duration ? ' &nbsp;·&nbsp; ' + fmtDuration(ep.enclosure.duration) : ''}</div>
            </div>
            <span class="episode-arrow">→</span>
          </a>
        `).join('');
      })
      .catch(() => {
        document.getElementById('episodes').innerHTML =
          '<p style="color:var(--muted);font-family:var(--sans);font-size:.9rem;">Could not load episodes.</p>';
      });
  </script>

</body>
</html>
