<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>God Revealing God</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #ffffff;
      --paper: #f0f3f7;
      --ink:   #1a2035;
      --muted: #7a8499;
      --gold:  #4a7eb5;
      --rule:  #dde3ec;
      --serif: 'EB Garamond', Georgia, serif;
      --sans:  'Inter', system-ui, sans-serif;
    }

    body {
      background: var(--cream);
      color: var(--ink);
      font-family: var(--serif);
      min-height: 100vh;
    }

    /* ── Nav ── */
    nav {
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding: 1rem 1.5rem;
      background: #232e48;
      border-bottom: 1px solid #2c3a55;
      font-family: var(--sans);
      font-size: .75rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    nav a {
      color: #8aadd4;
      text-decoration: none;
      transition: color .18s;
    }

    nav a:hover { color: #f0f4fa; }

    /* ── Hero ── */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10rem 2rem 9rem;
      background: #1a2035;
      position: relative;
      border-bottom: 1px solid #2c3a55;
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 50%;
      transform: translateX(-50%);
      width: 60px; height: 2px;
      background: var(--gold);
    }

    .hero-title {
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      font-weight: 400;
      letter-spacing: .04em;
      color: #f0f4fa;
      line-height: 1.08;
    }

    .hero-tagline {
      font-family: var(--sans);
      font-size: .72rem;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: #7a9ec4;
      margin-top: 1.75rem;
    }

    /* ── Section ── */
    .section { max-width: 960px; margin: 0 auto; padding: 5rem 1.5rem; }

    .section-label {
      font-family: var(--sans);
      font-size: .7rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2.5rem;
      display: flex;
      align-items: center;
      gap: .9rem;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--rule);
    }

    /* ── Ministry card ── */
    .ministry-card {
      display: flex;
      align-items: center;
      gap: 1.75rem;
      padding-bottom: 2.75rem;
      border-bottom: 1px solid var(--rule);
    }

    .ministry-art {
      width: 110px;
      height: 110px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 4px 18px rgba(0,0,0,.1);
    }

    .ministry-info h2 {
      font-size: 1.6rem;
      font-weight: 400;
      margin-bottom: .4rem;
    }

    .ministry-tagline {
      font-family: var(--sans);
      font-size: .85rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: .9rem;
    }

    .ministry-link {
      display: inline-block;
      font-family: var(--sans);
      font-size: .8rem;
      color: #3b6ea5;
      text-decoration: none;
      letter-spacing: .04em;
      border-bottom: 1px solid #3b6ea5;
      padding-bottom: 1px;
      transition: opacity .18s;
    }

    .ministry-link:hover { opacity: .7; }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--rule);
      padding: 2rem 1.5rem;
      text-align: center;
      font-family: var(--sans);
      font-size: .68rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    @media (max-width: 540px) {
      .ministry-card { flex-direction: column; align-items: flex-start; gap: 1.25rem; }
      .ministry-art { width: 90px; height: 90px; }
    }
  </style>
</head>
<body>

  <!-- Nav -->
  <nav>
    <a href="index.html">Home</a>
    <a href="https://godrevealinggod.substack.com" target="_blank" rel="noopener">Blog</a>
    <a href="about.html">About</a>
  </nav>

  <!-- Hero -->
  <section class="hero">
    <h1 class="hero-title">God Revealing God</h1>
    <p class="hero-tagline">through His Word, by His Spirit, for His glory</p>
  </section>

  <!-- Ministries -->
  <div class="section">
    <div class="section-label">GRG Ministries</div>

    <div class="ministry-card">
      <img class="ministry-art"
           src="https://hosting-media.riverside.com/media/podcasts/87ed1cb3-e6d3-4987-889e-8df98a594110/logos/90d9d428-9001-4b2c-bf42-3b40fa7dd4cc.png"
           alt="Die Well Media">
      <div class="ministry-info">
        <h2>Die Well Media</h2>
        <p class="ministry-tagline">A ministry to help Christian men go all-in on eternity</p>
        <a class="ministry-link" href="https://diewellmedia.com" target="_blank" rel="noopener">diewellmedia.com</a>
      </div>
    </div>
  </div>

  <footer>God Revealing God</footer>

</body>
</html>
